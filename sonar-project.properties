# SonarQube static analysis for ACEest Fitness & Gym
sonar.projectKey=aceest-fitness
sonar.projectName=ACEest Fitness & Gym
sonar.projectVersion=3.0.0

sonar.sources=app.py
sonar.tests=tests,smoke
sonar.exclusions=legacy/**,docs/**,k8s/**
sonar.python.version=3.12
sonar.sourceEncoding=UTF-8

# Reports produced by the Jenkins "Unit Tests" stage
sonar.python.coverage.reportPaths=reports/coverage.xml
sonar.python.xunit.reportPath=reports/pytest.xml

# Block until SonarQube computes the Quality Gate; fail the build if it fails.
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300
