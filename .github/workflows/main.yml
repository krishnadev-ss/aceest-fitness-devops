name: CI/CD Pipeline

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: aceest-fitness

jobs:
  build-lint:
    name: Build & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Compile (syntax check)
        run: python -m compileall -q app.py tests

      - name: Lint with flake8
        run: flake8 . --count --show-source --statistics

  docker-build:
    name: Docker Image Assembly
    runs-on: ubuntu-latest
    needs: build-lint
    steps:
      - uses: actions/checkout@v4

      - name: Build runtime image
        run: docker build -t "$IMAGE:${{ github.sha }}" .

      - name: Smoke test - container starts and reports healthy
        run: |
          docker run -d --name aceest -p 5000:5000 "$IMAGE:${{ github.sha }}"
          for i in $(seq 1 15); do
            if curl -fsS http://localhost:5000/health; then exit 0; fi
            sleep 2
          done
          docker logs aceest
          exit 1

  test:
    name: Automated Testing (in container)
    runs-on: ubuntu-latest
    needs: docker-build
    steps:
      - uses: actions/checkout@v4

      - name: Build test image
        run: docker build --target test -t "$IMAGE:test" .

      - name: Run Pytest inside the container
        run: docker run --rm "$IMAGE:test"
