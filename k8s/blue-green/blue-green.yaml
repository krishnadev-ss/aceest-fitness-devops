# Blue-Green: two full environments. 'aceest-bluegreen' (NodePort 30081) sends
# all traffic to one colour; 'aceest-bluegreen-preview' (NodePort 30085) points at
# the idle colour for testing. Switching / rolling back = patching the selector.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-blue
  namespace: aceest
  labels: {app: aceest-bg, track: blue, app.kubernetes.io/part-of: aceest-fitness}
  annotations:
    kubernetes.io/change-cause: "initial deploy of __STABLE_TAG__"
spec:
  replicas: 2
  revisionHistoryLimit: 10
  minReadySeconds: 5
  selector:
    matchLabels: {app: aceest-bg, track: blue}
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  template:
    metadata:
      labels: {app: aceest-bg, track: blue, app.kubernetes.io/part-of: aceest-fitness}
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 10001, fsGroup: 10001}
      containers:
        - name: aceest
          image: __IMAGE_REPO__:__STABLE_TAG__
          imagePullPolicy: IfNotPresent
          ports: [{name: http, containerPort: 5000}]
          env:
            - {name: DEPLOY_TRACK, value: "blue"}
            - {name: ACEEST_DB, value: /app/data/aceest_fitness.db}
          resources:
            requests: {cpu: 50m, memory: 96Mi}
            limits: {cpu: 500m, memory: 256Mi}
          readinessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 3
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 15
            periodSeconds: 10
          volumeMounts: [{name: data, mountPath: /app/data}]
      volumes: [{name: data, emptyDir: {}}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-green
  namespace: aceest
  labels: {app: aceest-bg, track: green, app.kubernetes.io/part-of: aceest-fitness}
  annotations:
    kubernetes.io/change-cause: "initial deploy of __NEW_TAG__"
spec:
  replicas: 2
  revisionHistoryLimit: 10
  minReadySeconds: 5
  selector:
    matchLabels: {app: aceest-bg, track: green}
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  template:
    metadata:
      labels: {app: aceest-bg, track: green, app.kubernetes.io/part-of: aceest-fitness}
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 10001, fsGroup: 10001}
      containers:
        - name: aceest
          image: __IMAGE_REPO__:__NEW_TAG__
          imagePullPolicy: IfNotPresent
          ports: [{name: http, containerPort: 5000}]
          env:
            - {name: DEPLOY_TRACK, value: "green"}
            - {name: ACEEST_DB, value: /app/data/aceest_fitness.db}
          resources:
            requests: {cpu: 50m, memory: 96Mi}
            limits: {cpu: 500m, memory: 256Mi}
          readinessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 3
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 15
            periodSeconds: 10
          volumeMounts: [{name: data, mountPath: /app/data}]
      volumes: [{name: data, emptyDir: {}}]
---
apiVersion: v1
kind: Service
metadata:
  name: aceest-bluegreen
  namespace: aceest
  labels: {app.kubernetes.io/part-of: aceest-fitness}
spec:
  type: NodePort
  selector: {app: aceest-bg, track: blue}
  ports:
    - name: http
      port: 80
      targetPort: 5000
      nodePort: 30081
---
apiVersion: v1
kind: Service
metadata:
  name: aceest-bluegreen-preview
  namespace: aceest
  labels: {app.kubernetes.io/part-of: aceest-fitness}
spec:
  type: NodePort
  selector: {app: aceest-bg, track: green}
  ports:
    - name: http
      port: 80
      targetPort: 5000
      nodePort: 30085
