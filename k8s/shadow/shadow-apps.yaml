# Shadow: 'live' serves users; NGINX mirrors every request to 'shadow'
# (new release) and throws the shadow response away. Users never see
# the shadow; its access log (kubectl logs) shows the mirrored traffic.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-live
  namespace: aceest
  labels: {app: aceest-shadow, track: live, app.kubernetes.io/part-of: aceest-fitness}
  annotations:
    kubernetes.io/change-cause: "initial deploy of __STABLE_TAG__"
spec:
  replicas: 1
  revisionHistoryLimit: 10
  minReadySeconds: 5
  selector:
    matchLabels: {app: aceest-shadow, track: live}
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  template:
    metadata:
      labels: {app: aceest-shadow, track: live, app.kubernetes.io/part-of: aceest-fitness}
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 10001, fsGroup: 10001}
      containers:
        - name: aceest
          image: __IMAGE_REPO__:__STABLE_TAG__
          imagePullPolicy: IfNotPresent
          ports: [{name: http, containerPort: 5000}]
          env:
            - {name: DEPLOY_TRACK, value: "live"}
            - {name: ACEEST_DB, value: /app/data/aceest_fitness.db}
          resources:
            requests: {cpu: 50m, memory: 96Mi}
            limits: {cpu: 500m, memory: 256Mi}
          readinessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 3
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 15
            periodSeconds: 10
          volumeMounts: [{name: data, mountPath: /app/data}]
      volumes: [{name: data, emptyDir: {}}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-shadow
  namespace: aceest
  labels: {app: aceest-shadow, track: shadow, app.kubernetes.io/part-of: aceest-fitness}
  annotations:
    kubernetes.io/change-cause: "initial deploy of __NEW_TAG__"
spec:
  replicas: 1
  revisionHistoryLimit: 10
  minReadySeconds: 5
  selector:
    matchLabels: {app: aceest-shadow, track: shadow}
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  template:
    metadata:
      labels: {app: aceest-shadow, track: shadow, app.kubernetes.io/part-of: aceest-fitness}
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 10001, fsGroup: 10001}
      containers:
        - name: aceest
          image: __IMAGE_REPO__:__NEW_TAG__
          imagePullPolicy: IfNotPresent
          ports: [{name: http, containerPort: 5000}]
          env:
            - {name: DEPLOY_TRACK, value: "shadow"}
            - {name: ACEEST_DB, value: /app/data/aceest_fitness.db}
          resources:
            requests: {cpu: 50m, memory: 96Mi}
            limits: {cpu: 500m, memory: 256Mi}
          readinessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 3
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 15
            periodSeconds: 10
          volumeMounts: [{name: data, mountPath: /app/data}]
      volumes: [{name: data, emptyDir: {}}]
---
apiVersion: v1
kind: Service
metadata:
  name: aceest-live
  namespace: aceest
  labels: {app.kubernetes.io/part-of: aceest-fitness}
spec:
  type: ClusterIP
  selector: {app: aceest-shadow, track: live}
  ports:
    - name: http
      port: 80
      targetPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: aceest-shadow
  namespace: aceest
  labels: {app.kubernetes.io/part-of: aceest-fitness}
spec:
  type: ClusterIP
  selector: {app: aceest-shadow, track: shadow}
  ports:
    - name: http
      port: 80
      targetPort: 5000
