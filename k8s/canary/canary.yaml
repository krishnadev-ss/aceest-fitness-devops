# Canary: stable (3 pods) and canary (1 pod) share the label app=aceest-canary,
# so the service (NodePort 30082) sends ~25% of requests to the canary.
# 'aceest-canary-only' targets just the canary pod for its smoke test.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-stable
  namespace: aceest
  labels: {app: aceest-canary, track: stable, app.kubernetes.io/part-of: aceest-fitness}
  annotations:
    kubernetes.io/change-cause: "initial deploy of __STABLE_TAG__"
spec:
  replicas: 3
  revisionHistoryLimit: 10
  minReadySeconds: 5
  selector:
    matchLabels: {app: aceest-canary, track: stable}
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  template:
    metadata:
      labels: {app: aceest-canary, track: stable, app.kubernetes.io/part-of: aceest-fitness}
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 10001, fsGroup: 10001}
      containers:
        - name: aceest
          image: __IMAGE_REPO__:__STABLE_TAG__
          imagePullPolicy: IfNotPresent
          ports: [{name: http, containerPort: 5000}]
          env:
            - {name: DEPLOY_TRACK, value: "stable"}
            - {name: ACEEST_DB, value: /app/data/aceest_fitness.db}
          resources:
            requests: {cpu: 50m, memory: 96Mi}
            limits: {cpu: 500m, memory: 256Mi}
          readinessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 3
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 15
            periodSeconds: 10
          volumeMounts: [{name: data, mountPath: /app/data}]
      volumes: [{name: data, emptyDir: {}}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-canary
  namespace: aceest
  labels: {app: aceest-canary, track: canary, app.kubernetes.io/part-of: aceest-fitness}
  annotations:
    kubernetes.io/change-cause: "initial deploy of __NEW_TAG__"
spec:
  replicas: 1
  revisionHistoryLimit: 10
  minReadySeconds: 5
  selector:
    matchLabels: {app: aceest-canary, track: canary}
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  template:
    metadata:
      labels: {app: aceest-canary, track: canary, app.kubernetes.io/part-of: aceest-fitness}
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 10001, fsGroup: 10001}
      containers:
        - name: aceest
          image: __IMAGE_REPO__:__NEW_TAG__
          imagePullPolicy: IfNotPresent
          ports: [{name: http, containerPort: 5000}]
          env:
            - {name: DEPLOY_TRACK, value: "canary"}
            - {name: ACEEST_DB, value: /app/data/aceest_fitness.db}
          resources:
            requests: {cpu: 50m, memory: 96Mi}
            limits: {cpu: 500m, memory: 256Mi}
          readinessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 3
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 15
            periodSeconds: 10
          volumeMounts: [{name: data, mountPath: /app/data}]
      volumes: [{name: data, emptyDir: {}}]
---
apiVersion: v1
kind: Service
metadata:
  name: aceest-canary
  namespace: aceest
  labels: {app.kubernetes.io/part-of: aceest-fitness}
spec:
  type: NodePort
  selector: {app: aceest-canary}
  ports:
    - name: http
      port: 80
      targetPort: 5000
      nodePort: 30082
---
apiVersion: v1
kind: Service
metadata:
  name: aceest-canary-only
  namespace: aceest
  labels: {app.kubernetes.io/part-of: aceest-fitness}
spec:
  type: ClusterIP
  selector: {app: aceest-canary, track: canary}
  ports:
    - name: http
      port: 80
      targetPort: 5000
